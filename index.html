<style>
  :root {
    color-scheme: dark light;
    --font-display: "Syne", "Newsreader", serif;
    --font-serif: "Newsreader", serif;
    --font-sans: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-mono: "JetBrains Mono", monospace;
  }

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html {
    scroll-behavior: auto;
    text-size-adjust: 100%;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  html.lenis, html.lenis body {
    height: auto;
  }

  .lenis.lenis-smooth {
    scroll-behavior: auto !important;
  }

  .lenis.lenis-smooth [data-lenis-prevent] {
    overscroll-behavior: contain;
  }

  body {
    margin: 0;
    font-family: var(--font-sans);
    background: #0B0D0E;
    color: #F3F2EE;
    line-height: 1.6;
    overflow-x: hidden;
  }

  /* Subtle Noise Texture Overlay */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 999;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
  }

  .site {
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    transition: background 0.4s ease, color 0.4s ease;
  }

  .wrap {
    max-width: 1240px;
    margin: 0 auto;
    padding: 0 32px;
    width: 100%;
  }

  /* ---- Typography & Anti-Runt Rules ---- */
  h1, h2, h3, h4,
  .section-heading,
  .hero-headline,
  .service-card-tagline,
  .about-quote-text,
  .lightbox-title,
  .success-heading,
  .process-card-title {
    font-family: var(--font-display);
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--ink);
    text-wrap: balance;
  }

  p,
  .section-sub,
  .hero-sub,
  .service-card-body,
  .about-para,
  .faq-answer,
  .contact-sub-text,
  .success-message,
  .process-card-desc,
  .lightbox-caption {
    text-wrap: pretty;
  }

  .section-heading {
    font-size: calc(clamp(30px, 3.6vw, 50px) * var(--hscale, 1));
    line-height: 1.12;
    margin-bottom: 18px;
    max-width: 720px;
  }

  .section-sub {
    font-size: clamp(15px, 1.15vw, 18px);
    color: var(--ink-sec, #B4B8BC);
    max-width: 620px;
    line-height: 1.65;
    margin-bottom: 44px;
  }

  .section-sub.center {
    margin-left: auto;
    margin-right: auto;
    text-align: center;
  }

  .section-eyebrow-wrap {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }

  .section-eyebrow-wrap.center {
    justify-content: center;
    width: 100%;
  }

  .eyebrow-accent-line {
    width: 28px;
    height: 2px;
    background: var(--accent);
    display: inline-block;
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
  }

  .eyebrow.accent {
    color: var(--accent);
  }

  /* ---- Buttons & Interactive Controls ---- */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 13px 26px;
    border-radius: 999px;
    font-family: var(--font-sans);
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    position: relative;
    user-select: none;
    white-space: nowrap;
  }

  .btn-lg {
    padding: 16px 32px;
    font-size: 15px;
    letter-spacing: 0.01em;
  }

  .btn-md {
    padding: 11px 22px;
    font-size: 13.5px;
  }

  .btn-sm {
    padding: 9px 18px;
    font-size: 13px;
  }

  .btn-accent {
    background: var(--accent);
    color: var(--accent-ink);
    box-shadow: 0 4px 20px rgba(97, 154, 198, 0.28);
  }

  .btn-accent:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(97, 154, 198, 0.45);
    filter: brightness(1.08);
  }

  .btn-accent:active {
    transform: translateY(0);
  }

  .btn-ghost {
    background: rgba(255, 255, 255, 0.06);
    color: var(--ink);
    border-color: var(--line);
    backdrop-filter: blur(8px);
  }

  .btn-ghost:hover {
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.25);
    transform: translateY(-2px);
  }

  .btn-block {
    width: 100%;
  }

  /* ---- Navigation Bar ---- */
  .nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(11, 13, 14, 0.78);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--line);
    transition: all 0.3s ease;
  }

  .nav.is-scrolled {
    background: rgba(11, 13, 14, 0.94);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  }

  .nav-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 74px;
    gap: 24px;
  }

  .nav-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: var(--ink);
    white-space: nowrap;
  }

  .brand-mark {
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: var(--ink);
  }

  .brand-dot {
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
  }

  .brand-tag {
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.01em;
  }

  .nav-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--line);
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-sec);
    white-space: nowrap;
  }

  .live-pulse {
    width: 7px;
    height: 7px;
    background: #22C55E;
    border-radius: 50%;
    box-shadow: 0 0 8px #22C55E;
    animation: pulseGlow 2s infinite;
  }

  @keyframes pulseGlow {
    0% { opacity: 0.6; transform: scale(0.95); }
    50% { opacity: 1; transform: scale(1.15); box-shadow: 0 0 12px #22C55E; }
    100% { opacity: 0.6; transform: scale(0.95); }
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 32px;
  }

  .nav-link {
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-sec);
    text-decoration: none;
    transition: color 0.2s ease;
    position: relative;
    padding: 4px 0;
    white-space: nowrap;
  }

  .nav-link:hover {
    color: var(--ink);
  }

  .nav-link::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 0;
    width: 0;
    height: 2px;
    background: var(--accent);
    transition: width 0.25s ease;
  }

  .nav-link:hover::after {
    width: 100%;
  }

  .nav-cta-mobile {
    display: none;
  }

  .mobile-toggle {
    display: none;
    background: none;
    border: none;
    cursor: pointer;
    flex-direction: column;
    gap: 6px;
    padding: 8px;
  }

  .mobile-toggle span {
    display: block;
    width: 24px;
    height: 2px;
    background: var(--ink);
    transition: all 0.3s ease;
  }

  /* ---- Hero Section: Unobtrusive Docked Card & Crystal-Clear Photos ---- */
  .hero {
    position: relative;
    display: flex;
    align-items: flex-end;
    background: #080A0B;
    overflow: hidden;
  }

  .hero-slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 1;
  }

  .hero-slide.is-active {
    opacity: 1;
    pointer-events: auto;
  }

  .hero-triptych {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 2px;
    background: rgba(0, 0, 0, 0.4);
  }

  .hero-triptych-item, .hero-single-wrap {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  .hero-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    transform: scale(1.01);
    transition: transform 8s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  .hero-slide.is-active .hero-img {
    transform: scale(1.0);
  }

  .hero-item-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(11, 13, 14, 0.08) 0%, rgba(11, 13, 14, 0.25) 100%);
  }

  /* Camera HUD Viewfinder */
  .hero-viewfinder {
    position: absolute;
    inset: 24px;
    pointer-events: none;
    z-index: 3;
    border: 1px solid rgba(255, 255, 255, 0.05);
  }

  .vf-crosshair {
    position: absolute;
    width: 20px;
    height: 20px;
    border-color: rgba(255, 255, 255, 0.3);
    border-style: solid;
  }

  .vf-top-left { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
  .vf-top-right { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
  .vf-bottom-left { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }
  .vf-bottom-right { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

  .vf-center-bracket {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 50px;
    height: 50px;
    border: 1px dashed rgba(255, 255, 255, 0.15);
    border-radius: 50%;
  }

  .vf-meta-bar {
    position: absolute;
    display: flex;
    justify-content: space-between;
    width: calc(100% - 40px);
    left: 20px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    color: rgba(255, 255, 255, 0.6);
    text-transform: uppercase;
  }

  .vf-meta-top { top: 16px; }
  .vf-meta-bottom { bottom: 16px; }

  .vf-rec-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    background: #EF4444;
    border-radius: 50%;
    margin-right: 6px;
    animation: recBlink 1.5s infinite;
  }

  @keyframes recBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
  }

  /* Soft Bottom Gradient Scrim: leaves upper 75% photo crystal clear */
  .hero-scrim {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    background: linear-gradient(180deg, rgba(8, 10, 12, 0.05) 0%, rgba(8, 10, 12, 0.15) 50%, rgba(8, 10, 12, 0.6) 80%, rgba(8, 10, 12, 0.85) 100%);
  }

  /* Hero Wrap & Docked Glass Card */
  .hero-wrap {
    position: relative;
    z-index: 4;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    width: 100%;
    padding-top: 100px;
    padding-bottom: 36px;
    gap: 24px;
  }

  .hero-dock-card {
    position: relative;
    max-width: 440px;
    background: rgba(11, 13, 14, 0.72);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    padding: 24px 26px;
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
  }

  .hero-dock-card.is-center {
    margin: 0 auto;
    text-align: center;
    max-width: 520px;
  }

  .hero-eyebrow-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 5px 12px;
    background: rgba(97, 154, 198, 0.14);
    border: 1px solid rgba(97, 154, 198, 0.35);
    border-radius: 999px;
    margin-bottom: 14px;
    white-space: nowrap;
  }

  .hero-eyebrow-pill .pill-dot {
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
  }

  .hero-eyebrow-pill .pill-text {
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--accent);
    letter-spacing: 0.08em;
    font-weight: 500;
  }

  .hero-headline {
    font-size: clamp(26px, 2.7vw, 36px);
    line-height: 1.15;
    margin-bottom: 10px;
    letter-spacing: -0.025em;
  }

  .headline-main {
    display: block;
    color: #F3F2EE;
  }

  .headline-accent {
    display: block;
    font-family: var(--font-serif);
    font-style: italic;
    font-weight: 400;
    background: linear-gradient(135deg, #A8D1F0 0%, #619AC6 50%, #3D759F 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .hero-sub {
    font-size: 13.5px;
    line-height: 1.5;
    color: rgba(243, 242, 238, 0.84);
    margin-bottom: 18px;
    max-width: 400px;
  }

  .hero-ctas {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  .hero-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    padding-top: 14px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
  }

  .hero-stat-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
    white-space: nowrap;
  }

  .hero-stat-item .stat-num {
    font-family: var(--font-display);
    font-size: 17px;
    font-weight: 800;
    color: var(--accent);
  }

  .hero-stat-item .stat-label {
    font-family: var(--font-sans);
    font-size: 11px;
    color: var(--muted);
    font-weight: 500;
  }

  /* Hero Scrubber */
  .hero-scrubber {
    display: flex;
    gap: 10px;
    align-self: flex-end;
    margin-bottom: 0;
  }

  .scrubber-btn {
    background: rgba(11, 13, 14, 0.72);
    border: 1px solid var(--line);
    backdrop-filter: blur(12px);
    border-radius: 8px;
    padding: 8px 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    cursor: pointer;
    text-align: left;
    transition: all 0.25s ease;
    width: 105px;
  }

  .scrubber-btn:hover, .scrubber-btn.is-active {
    background: rgba(25, 30, 34, 0.85);
    border-color: var(--accent);
  }

  .scrubber-idx {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
  }

  .scrubber-btn.is-active .scrubber-idx {
    color: var(--accent);
  }

  .scrubber-label {
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
  }

  .scrubber-bar {
    width: 100%;
    height: 2px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 2px;
    overflow: hidden;
  }

  .scrubber-progress {
    height: 100%;
    background: var(--accent);
    transition: width 6s linear;
  }

  /* ---- Section Base ---- */
  .section {
    padding: var(--section-pad, 120px) 0;
    position: relative;
  }

  .section-ruled {
    border-top: 1px solid var(--line);
  }

  .section-head-flex {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 32px;
    margin-bottom: 48px;
    flex-wrap: wrap;
  }

  .section-head-center {
    text-align: center;
    max-width: 760px;
    margin: 0 auto 52px;
  }

  /* ---- Portfolio Section ---- */
  .portfolio-tabs {
    display: flex;
    gap: 8px;
    background: rgba(255, 255, 255, 0.03);
    padding: 6px;
    border-radius: 999px;
    border: 1px solid var(--line);
    flex-wrap: wrap;
  }

  .portfolio-tab {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 18px;
    border-radius: 999px;
    background: transparent;
    border: none;
    color: var(--ink-sec);
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
  }

  .portfolio-tab:hover {
    color: var(--ink);
  }

  .portfolio-tab.is-active {
    background: var(--accent);
    color: var(--accent-ink);
  }

  .tab-count {
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.25);
  }

  .portfolio-tab.is-active .tab-count {
    background: rgba(0, 0, 0, 0.35);
    color: var(--accent-ink);
  }

  /* Editorial Masonry Grid */
  .portfolio-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-auto-rows: 320px;
    gap: 20px;
  }

  .photo-card {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    background: var(--card-bg);
    border: 1px solid var(--line);
    transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.35s ease, box-shadow 0.35s ease;
  }

  .photo-card.is-vertical {
    grid-row: span 2;
  }

  .photo-card.is-horizontal {
    grid-row: span 1;
  }

  .photo-card:hover {
    transform: translateY(-6px);
    border-color: var(--line-highlight);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
  }

  .photo-card-media {
    position: relative;
    width: 100%;
    height: 100%;
  }

  .photo-card-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  .photo-card:hover .photo-card-img {
    transform: scale(1.04);
  }

  /* Keep scrim strictly to bottom 30% so photo subject is 100% visible */
  .photo-card-scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0) 65%, rgba(11,13,14,0.85) 100%);
    transition: opacity 0.3s ease;
  }

  .photo-card-meta-badge {
    position: absolute;
    top: 14px;
    left: 14px;
    background: rgba(11, 13, 14, 0.65);
    backdrop-filter: blur(8px);
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    font-family: var(--font-mono);
    font-size: 11px;
    color: rgba(255, 255, 255, 0.9);
    white-space: nowrap;
  }

  .photo-card-info {
    position: absolute;
    bottom: 16px;
    left: 16px;
    right: 16px;
  }

  .photo-card-cat {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    display: block;
    margin-bottom: 2px;
  }

  .photo-card-title {
    font-size: 17px;
    font-weight: 700;
    color: #FFFFFF;
    margin-bottom: 2px;
    text-wrap: balance;
  }

  .photo-card-location {
    font-size: 13px;
    color: rgba(255, 255, 255, 0.75);
  }

  .photo-card-expand-icon {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(11, 13, 14, 0.7);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #FFFFFF;
    opacity: 0;
    transform: scale(0.85);
    transition: all 0.25s ease;
  }

  .photo-card:hover .photo-card-expand-icon {
    opacity: 1;
    transform: scale(1);
  }

  /* ---- Full-Screen Lightbox Modal ---- */
  .lightbox-backdrop {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .lightbox-scrim {
    position: absolute;
    inset: 0;
    background: rgba(7, 9, 10, 0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }

  .lightbox-frame {
    position: relative;
    z-index: 10;
    max-width: 1100px;
    width: 100%;
    max-height: 90vh;
    display: grid;
    grid-template-columns: 1fr 340px;
    background: #12161A;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 32px 80px rgba(0, 0, 0, 0.8);
    animation: lightboxPop 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes lightboxPop {
    from { opacity: 0; transform: scale(0.96); }
    to { opacity: 1; transform: scale(1); }
  }

  .lightbox-close {
    position: absolute;
    top: 16px;
    right: 16px;
    z-index: 20;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .lightbox-close:hover {
    background: rgba(255, 255, 255, 0.15);
  }

  .lightbox-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 20;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .lightbox-prev { left: 16px; }
  .lightbox-next { right: 356px; }

  .lightbox-nav:hover {
    background: var(--accent);
    color: var(--accent-ink);
  }

  .lightbox-media {
    position: relative;
    background: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 460px;
    overflow: hidden;
  }

  .lightbox-img {
    max-width: 100%;
    max-height: 80vh;
    object-fit: contain;
  }

  .lightbox-info {
    padding: 36px 28px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background: #14191D;
    border-left: 1px solid rgba(255, 255, 255, 0.08);
  }

  .lightbox-info-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .lightbox-cat-badge {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    color: var(--accent);
    background: rgba(97, 154, 198, 0.15);
    padding: 4px 10px;
    border-radius: 4px;
    white-space: nowrap;
  }

  .lightbox-meta {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }

  .lightbox-title {
    font-size: 24px;
    margin-bottom: 8px;
    color: #FFFFFF;
  }

  .lightbox-location {
    font-size: 14px;
    color: var(--accent);
    margin-bottom: 16px;
    font-weight: 500;
  }

  .lightbox-caption {
    font-size: 14px;
    color: var(--ink-sec);
    line-height: 1.6;
    margin-bottom: 32px;
  }

  .lightbox-actions {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .lightbox-hint {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    text-align: center;
  }

  /* ---- Services Section ---- */
  .services-deck {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px;
  }

  .service-card {
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 40px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .service-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .service-card:hover {
    transform: translateY(-4px);
    border-color: var(--line-highlight);
    box-shadow: 0 20px 48px rgba(0, 0, 0, 0.4);
  }

  .service-card:hover::before {
    opacity: 1;
  }

  .service-card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .service-card-num {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    background: rgba(97, 154, 198, 0.12);
    padding: 4px 10px;
    border-radius: 4px;
    white-space: nowrap;
  }

  .service-card-cat {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    white-space: nowrap;
  }

  .service-card-tagline {
    font-size: 23px;
    font-weight: 700;
    line-height: 1.25;
    margin-bottom: 14px;
    color: var(--ink);
    max-width: 440px;
  }

  .service-card-body {
    font-size: 15px;
    line-height: 1.65;
    color: var(--ink-sec);
    margin-bottom: 24px;
    max-width: 460px;
  }

  .service-features {
    padding: 20px 0;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    margin-bottom: 20px;
  }

  .features-label {
    font-family: var(--font-mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .features-list {
    list-style: none;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .feature-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--ink);
  }

  .check-icon {
    color: var(--accent);
    flex-shrink: 0;
  }

  .service-highlight {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    font-size: 13px;
    color: var(--accent);
    font-weight: 500;
    margin-bottom: 24px;
  }

  /* ---- About Section ---- */
  .about-editorial-grid {
    display: grid;
    grid-template-columns: 460px 1fr;
    gap: 64px;
    align-items: center;
  }

  .about-media-col {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .about-frame {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--line);
    background: #111518;
  }

  .about-img-container {
    position: relative;
    aspect-ratio: 4/5;
  }

  .about-portrait-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .about-badge-floating {
    position: absolute;
    bottom: 20px;
    left: 20px;
    background: rgba(11, 13, 14, 0.85);
    backdrop-filter: blur(12px);
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: #FFFFFF;
    white-space: nowrap;
  }

  .about-viewfinder-overlay {
    position: absolute;
    inset: 12px;
    pointer-events: none;
  }

  .about-meta-tag {
    position: absolute;
    top: 12px;
    right: 12px;
    font-family: var(--font-mono);
    font-size: 10px;
    color: rgba(255, 255, 255, 0.7);
    letter-spacing: 0.1em;
    background: rgba(0, 0, 0, 0.5);
    padding: 4px 8px;
    border-radius: 4px;
    white-space: nowrap;
  }

  .about-badges-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .about-badge-card {
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 18px;
  }

  .badge-label {
    display: block;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 2px;
    white-space: nowrap;
  }

  .badge-val {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    white-space: nowrap;
  }

  .about-quote-box {
    padding: 24px;
    border-left: 3px solid var(--accent);
    background: rgba(97, 154, 198, 0.08);
    border-radius: 0 12px 12px 0;
    margin: 24px 0 32px;
  }

  .about-quote-text {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 19px;
    line-height: 1.5;
    color: var(--ink);
  }

  .about-para {
    font-size: 16px;
    line-height: 1.7;
    color: var(--ink-sec);
    margin-bottom: 18px;
    max-width: 580px;
  }

  .about-signatures {
    display: flex;
    align-items: center;
    gap: 28px;
    margin-top: 36px;
    flex-wrap: wrap;
  }

  .signature-tag {
    display: flex;
    flex-direction: column;
    white-space: nowrap;
  }

  .sig-name {
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 700;
    color: var(--ink);
  }

  .sig-title {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.08em;
  }

  /* ---- Process Section ---- */
  .process-timeline {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 28px;
  }

  .process-card {
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 36px;
    position: relative;
    transition: all 0.3s ease;
  }

  .process-card:hover {
    transform: translateY(-4px);
    border-color: var(--line-highlight);
  }

  .process-card-step {
    position: relative;
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: rgba(97, 154, 198, 0.12);
    border: 1px solid rgba(97, 154, 198, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
    white-space: nowrap;
  }

  .step-number {
    font-family: var(--font-mono);
    font-size: 18px;
    font-weight: 700;
    color: var(--accent);
  }

  .process-card-title {
    font-size: 21px;
    margin-bottom: 12px;
  }

  .process-card-desc {
    font-size: 15px;
    line-height: 1.65;
    color: var(--ink-sec);
  }

  /* ---- FAQ Section ---- */
  .faq-layout {
    display: grid;
    grid-template-columns: 400px 1fr;
    gap: 64px;
  }

  .faq-sub {
    font-size: 15px;
    color: var(--ink-sec);
    line-height: 1.6;
    margin-bottom: 28px;
    max-width: 360px;
  }

  .faq-accordion {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .faq-item {
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color 0.25s ease;
  }

  .faq-item.is-open {
    border-color: var(--line-highlight);
  }

  .faq-question {
    width: 100%;
    padding: 22px 24px;
    background: none;
    border: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    text-align: left;
    cursor: pointer;
    color: var(--ink);
  }

  .faq-q-text {
    font-family: var(--font-sans);
    font-size: 16px;
    font-weight: 600;
    text-wrap: balance;
    max-width: 90%;
  }

  .faq-icon {
    font-family: var(--font-mono);
    font-size: 20px;
    color: var(--accent);
    flex-shrink: 0;
  }

  .faq-answer {
    padding: 0 24px 22px;
    font-size: 14px;
    line-height: 1.65;
    color: var(--ink-sec);
    border-top: 1px solid rgba(255, 255, 255, 0.05);
  }

  .faq-answer p {
    padding-top: 16px;
  }

  /* ---- Interactive Booking Studio ---- */
  .contact-studio-grid {
    display: grid;
    grid-template-columns: 440px 1fr;
    gap: 60px;
    align-items: flex-start;
  }

  .contact-sub-text {
    font-size: 16px;
    color: var(--ink-sec);
    line-height: 1.65;
    margin-bottom: 36px;
    max-width: 420px;
  }

  .contact-perks-list {
    display: flex;
    flex-direction: column;
    gap: 20px;
    margin-bottom: 40px;
  }

  .contact-perk {
    display: flex;
    gap: 16px;
  }

  .perk-icon {
    font-size: 20px;
    flex-shrink: 0;
  }

  .contact-perk strong {
    font-size: 15px;
    color: var(--ink);
    display: block;
    margin-bottom: 2px;
    text-wrap: balance;
  }

  .contact-perk p {
    font-size: 13px;
    color: var(--ink-sec);
    line-height: 1.5;
  }

  .direct-email-box {
    padding: 20px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--line);
  }

  .direct-label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    font-family: var(--font-mono);
  }

  .direct-email-link {
    color: var(--accent);
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    transition: opacity 0.2s ease;
  }

  .direct-email-link:hover {
    opacity: 0.8;
  }

  .contact-form-card {
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 44px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4);
  }

  .form-step-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--line);
  }

  .step-badge {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 600;
    white-space: nowrap;
  }

  .required-note {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }

  .field-group {
    margin-bottom: 24px;
  }

  .field-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 10px;
    text-wrap: balance;
  }

  .shoot-type-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .shoot-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--line);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
  }

  .shoot-chip:hover {
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(255, 255, 255, 0.2);
  }

  .shoot-chip.is-selected {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
    font-weight: 600;
  }

  .chip-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.3);
  }

  .shoot-chip.is-selected .chip-dot {
    background: var(--accent-ink);
  }

  .form-row-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    margin-bottom: 20px;
  }

  .field {
    margin-bottom: 20px;
  }

  .input-control {
    width: 100%;
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px 18px;
    font-family: var(--font-sans);
    font-size: 15px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .input-control:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(97, 154, 198, 0.25);
  }

  .textarea-control {
    resize: vertical;
    min-height: 110px;
  }

  .field.has-error .input-control {
    border-color: #EF4444;
  }

  .field-error-msg {
    font-size: 12px;
    color: #EF4444;
    margin-top: 6px;
  }

  .btn-submit {
    margin-top: 10px;
  }

  .form-error-alert {
    padding: 14px;
    border-radius: 8px;
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid #EF4444;
    color: #FCA5A5;
    font-size: 13px;
    margin-top: 16px;
  }

  /* Booking Success State */
  .booking-success-state {
    text-align: center;
    padding: 36px 12px;
  }

  .success-icon-badge {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: rgba(34, 197, 94, 0.15);
    border: 2px solid #22C55E;
    color: #22C55E;
    font-size: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
  }

  .success-heading {
    font-size: 28px;
    margin-bottom: 12px;
  }

  .success-message {
    font-size: 15px;
    color: var(--ink-sec);
    line-height: 1.6;
    max-width: 480px;
    margin: 0 auto 24px;
  }

  .success-reassurance {
    background: rgba(255, 255, 255, 0.04);
    border-radius: 8px;
    padding: 14px 20px;
    font-size: 13px;
    color: var(--ink);
    margin-bottom: 28px;
    text-wrap: balance;
  }

  /* ---- Footer ---- */
  .footer {
    background: #07090A;
    border-top: 1px solid var(--line);
    padding: 80px 0 40px;
    color: var(--ink);
  }

  .footer-top-row {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr;
    gap: 48px;
    margin-bottom: 60px;
  }

  .footer-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    margin-bottom: 16px;
  }

  .footer-coords {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--accent);
    margin-bottom: 8px;
    white-space: nowrap;
  }

  .footer-motto {
    font-size: 14px;
    color: var(--muted);
    max-width: 320px;
  }

  .footer-col-title {
    font-family: var(--font-mono);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    display: block;
    margin-bottom: 20px;
    white-space: nowrap;
  }

  .footer-links {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .footer-links a {
    color: var(--ink-sec);
    text-decoration: none;
    font-size: 14px;
    transition: color 0.2s ease;
    white-space: nowrap;
  }

  .footer-links a:hover {
    color: var(--accent);
  }

  .footer-bottom-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 32px;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    flex-wrap: wrap;
    gap: 20px;
  }

  .footer-copy {
    font-size: 13px;
    color: var(--muted);
  }

  .footer-badges {
    display: flex;
    gap: 12px;
  }

  .footer-badge-pill {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    background: rgba(255, 255, 255, 0.04);
    padding: 4px 10px;
    border-radius: 4px;
    white-space: nowrap;
  }

  /* ---- Responsive Adjustments: Mobile & Tablet Optimization ---- */
  @media (max-width: 1024px) {
    .wrap { padding: 0 24px; }
    .hero-triptych { grid-template-columns: 1fr; }
    .hero-triptych-item:not(:first-child) { display: none; }
    .portfolio-grid { grid-template-columns: repeat(2, 1fr); }
    .services-deck { grid-template-columns: 1fr; }
    .about-editorial-grid { grid-template-columns: 1fr; gap: 48px; }
    .contact-studio-grid { grid-template-columns: 1fr; gap: 48px; }
    .faq-layout { grid-template-columns: 1fr; gap: 36px; }
    .process-timeline { grid-template-columns: 1fr; gap: 20px; }
    .footer-top-row { grid-template-columns: 1fr 1fr; gap: 36px; }
    .hero-scrubber { display: none; }
    .lightbox-frame { grid-template-columns: 1fr; max-height: 94vh; overflow-y: auto; }
    .lightbox-next { right: 16px; }
  }

  @media (max-width: 768px) {
    .wrap { padding: 0 18px; }
    .section { padding: 76px 0; }
    
    /* Sticky Mobile Header */
    .nav-inner { height: 68px; }
    .nav-brand { gap: 8px; }
    .brand-mark { font-size: 23px; }
    .brand-tag { font-size: 11.5px; }
    .nav-badge { display: none; }
    .nav-cta { display: none; }

    /* Animated Hamburger Toggle */
    .mobile-toggle {
      display: flex;
      width: 40px;
      height: 40px;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--line);
    }
    .mobile-toggle span {
      width: 20px;
      height: 2px;
      background: var(--ink);
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .mobile-toggle.is-active span:nth-child(1) {
      transform: translateY(8px) rotate(45deg);
    }
    .mobile-toggle.is-active span:nth-child(2) {
      opacity: 0;
      transform: scaleX(0);
    }
    .mobile-toggle.is-active span:nth-child(3) {
      transform: translateY(-8px) rotate(-45deg);
    }

    /* Mobile Dropdown Drawer */
    .nav-links {
      position: fixed;
      top: 68px;
      left: 0;
      right: 0;
      background: rgba(11, 13, 14, 0.98);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      flex-direction: column;
      padding: 24px 20px 32px;
      gap: 16px;
      border-bottom: 1px solid var(--line);
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.6);
      transform: translateY(-130%);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 99;
    }
    .nav-links.is-open {
      transform: translateY(0);
    }
    .nav-link {
      font-size: 17px;
      font-weight: 600;
      padding: 10px 0;
      width: 100%;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .nav-cta-mobile {
      display: inline-flex;
      width: 100%;
      margin-top: 10px;
      padding: 14px 20px;
      font-size: 15px;
      justify-content: center;
    }

    /* Hero Mobile View: Compact HUD & Docked Glass Card with Unobstructed Subject Faces */
    .hero {
      min-height: 85vh;
      min-height: 560px;
    }
    .hero-viewfinder {
      inset: 10px;
    }
    .vf-crosshair {
      width: 12px;
      height: 12px;
    }
    .vf-center-bracket {
      width: 32px;
      height: 32px;
    }
    .vf-meta-bar {
      width: calc(100% - 20px);
      left: 10px;
      font-size: 9px;
    }
    .vf-meta-top { top: 10px; }
    .vf-meta-bottom { bottom: 10px; }
    .vf-slide-label { display: none; }
    .vf-coord { display: none; }

    .hero-scrim {
      background: linear-gradient(180deg, rgba(8, 10, 12, 0) 0%, rgba(8, 10, 12, 0.1) 40%, rgba(8, 10, 12, 0.5) 75%, rgba(8, 10, 12, 0.88) 100%);
    }
    .hero-wrap {
      min-height: 85vh;
      padding: 0 0 16px;
      justify-content: center;
      align-items: flex-end;
    }
    .hero-dock-card {
      width: calc(100% - 24px);
      max-width: 100%;
      margin: 0 12px;
      padding: 16px 18px 14px;
      border-radius: 14px;
      background: rgba(11, 13, 14, 0.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
    }
    .hero-eyebrow-pill {
      margin-bottom: 8px;
      padding: 4px 10px;
      font-size: 10.5px;
    }
    .hero-headline {
      font-size: clamp(20px, 6.2vw, 26px);
      line-height: 1.15;
      margin-bottom: 6px;
    }
    .hero-sub {
      font-size: 12.5px;
      line-height: 1.45;
      margin-bottom: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .hero-ctas {
      flex-direction: row;
      width: 100%;
      gap: 8px;
      margin-bottom: 12px;
    }
    .hero-ctas .btn {
      flex: 1;
      padding: 11px 12px;
      font-size: 13px;
      justify-content: center;
    }
    .hero-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .hero-stat-item .stat-num {
      font-size: 15px;
    }
    .hero-stat-item .stat-label {
      font-size: 9.5px;
    }

    /* Horizontal Swipeable Category Tabs */
    .portfolio-tabs {
      overflow-x: auto;
      flex-wrap: nowrap;
      -webkit-overflow-scrolling: touch;
      padding: 6px;
      border-radius: 999px;
      scrollbar-width: none;
      -ms-overflow-style: none;
      width: 100%;
    }
    .portfolio-tabs::-webkit-scrollbar {
      display: none;
    }
    .portfolio-tab {
      flex-shrink: 0;
      padding: 7px 14px;
      font-size: 12.5px;
    }

    /* Single Column Mobile Portfolio Grid */
    .portfolio-grid {
      grid-template-columns: 1fr;
      grid-auto-rows: auto;
      gap: 16px;
    }
    .photo-card {
      min-height: 280px;
      aspect-ratio: 4/5;
    }
    .photo-card.is-vertical {
      grid-row: span 1;
      aspect-ratio: 3/4;
    }
    .photo-card.is-horizontal {
      grid-row: span 1;
      aspect-ratio: 4/3;
    }
    .photo-card-expand-icon {
      opacity: 0.85;
      transform: scale(1);
    }

    /* Mobile Lightbox Modal */
    .lightbox-backdrop {
      padding: 10px;
    }
    .lightbox-frame {
      grid-template-columns: 1fr;
      max-height: 92vh;
      border-radius: 14px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .lightbox-media {
      min-height: 220px;
      max-height: 44vh;
    }
    .lightbox-prev {
      left: 10px;
      width: 40px;
      height: 40px;
    }
    .lightbox-next {
      right: 10px;
      width: 40px;
      height: 40px;
    }
    .lightbox-info {
      padding: 22px 18px;
      border-left: none;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .lightbox-title {
      font-size: 20px;
      margin-bottom: 4px;
    }
    .lightbox-caption {
      font-size: 13.5px;
      margin-bottom: 22px;
    }

    /* Services Mobile Layout */
    .service-card {
      padding: 28px 20px;
      border-radius: 14px;
    }
    .service-card-tagline {
      font-size: 21px;
    }
    .features-list {
      grid-template-columns: 1fr;
      gap: 8px;
    }

    /* About Mobile Layout */
    .about-frame {
      max-width: 320px;
      margin: 0 auto;
    }
    .about-badges-grid {
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .about-quote-box {
      padding: 18px 20px;
      margin: 20px 0 24px;
    }
    .about-quote-text {
      font-size: 17px;
    }

    /* Process Mobile Layout */
    .process-card {
      padding: 26px 20px;
      border-radius: 14px;
    }

    /* FAQ Mobile Layout */
    .faq-question {
      padding: 18px 18px;
    }
    .faq-q-text {
      font-size: 15px;
    }
    .faq-answer {
      padding: 0 18px 18px;
      font-size: 13.5px;
    }

    /* Contact Mobile Layout */
    .contact-form-card {
      padding: 24px 18px;
      border-radius: 16px;
    }
    .form-row-2 {
      grid-template-columns: 1fr;
      gap: 0;
    }
    /* Set input font-size to 16px to avoid iOS auto-zoom */
    .input-control {
      font-size: 16px;
      padding: 13px 15px;
    }
    .shoot-type-chips {
      gap: 8px;
    }
    .shoot-chip {
      padding: 8px 14px;
      font-size: 12.5px;
    }

    /* Footer Mobile */
    .footer-top-row {
      grid-template-columns: 1fr;
      gap: 32px;
    }
    .footer-bottom-row {
      flex-direction: column;
      align-items: flex-start;
      gap: 16px;
    }
  }

  @media (max-width: 480px) {
    .brand-tag { display: none; }
    .hero-stats {
      grid-template-columns: 1fr 1fr 1fr;
    }
    .about-signatures {
      flex-direction: column;
      align-items: flex-start;
      gap: 14px;
    }
  }

  /* ---- Reduced Motion Preference ---- */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
    .hero-img { transform: none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="site-copy.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="site-components.jsx"></script>
<script type="text/babel" src="site-app.jsx"></script>

<!-- Tweaks panel: open with Ctrl+Shift+E in your browser -->
<script>
document.addEventListener('keydown', function(e) {
  if (e.ctrlKey && e.shiftKey && e.key === 'E') {
    window.postMessage({ type: '__activate_edit_mode' }, '*');
  }
});
</script>
</body>
</html>
